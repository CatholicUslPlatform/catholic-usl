<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catholic USL</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --navy:#02205A; --navy2:#0A3280; --gold:#FDC53E; --green:#1FA84F;
  --bg:#F4F6FB; --card:#FFFFFF; --ink:#0E1B3D; --muted:#53607E; --line:#D9DFEE;
  --fs:17px;
}
:root[data-contrast="high"]{ --bg:#fff; --ink:#000; --muted:#222; --line:#000; --card:#fff; }
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:var(--fs);color:var(--ink);background:var(--bg);
  padding-top:env(safe-area-inset-top,0px)}
#app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;position:relative}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.screen{flex:1;padding:16px 16px 96px}
.splash{background:var(--navy);color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;gap:18px}
.splash img{width:min(78%,320px);height:auto}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:16px;font-weight:700;font-size:1.05em;background:var(--navy2);color:#fff;text-align:center}
.btn.gold{background:var(--gold);color:var(--navy)}
.btn.ghost{background:transparent;color:var(--navy2);border:2px solid var(--navy2)}
.btn.small{width:auto;display:inline-block;padding:10px 16px}
h1{font-size:1.5em;margin:4px 0 6px;color:var(--navy)}
h2{font-size:1.15em;margin:20px 0 8px;color:var(--navy)}
p{line-height:1.5;margin:0 0 10px}
.muted{color:var(--muted)}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.back{border:0;background:var(--card);border:2px solid var(--line);border-radius:12px;width:44px;height:44px;font-size:1.3em;color:var(--navy)}
.hero{background:var(--navy);color:#fff;border-radius:18px;padding:18px;margin:6px 0 16px;position:relative;overflow:hidden}
.hero h1{color:#fff;margin:0 0 6px}
.hero .sun{position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;border:10px solid var(--gold);opacity:.9}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px 10px;text-align:center;font-weight:700;color:var(--navy);min-height:92px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.tile svg{width:30px;height:30px;stroke:var(--navy2);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;width:100%;text-align:left;color:var(--ink);display:block}
.row{display:flex;gap:12px;align-items:center}
.thumb{width:64px;height:64px;border-radius:12px;background:var(--navy);display:flex;align-items:center;justify-content:center;flex:none}
.thumb svg{width:26px;height:26px;fill:var(--gold)}
.badge{display:inline-block;font-size:.78em;font-weight:700;padding:3px 9px;border-radius:999px;background:#FFF1CC;color:#6B4B00;border:1px solid #E9C45A}
.badge.ok{background:#DDF3E5;color:#0E5A2A;border-color:#8AD0A3}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px}
.chip{flex:none;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;color:var(--navy);font-weight:700}
.chip.on{background:var(--navy2);color:#fff;border-color:var(--navy2)}
input[type=search],input[type=text],input[type=email],input[type=password],textarea{width:100%;padding:14px;border:2px solid var(--line);border-radius:12px;font:inherit;background:var(--card);color:var(--ink)}
.player{background:var(--navy);border-radius:16px;overflow:hidden;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;color:#fff;text-align:center;padding:14px;margin-bottom:12px}
.player video{width:100%;height:100%;background:#000}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);border-top:2px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{flex:1;border:0;background:none;padding:10px 4px;color:var(--muted);font-weight:700;font-size:.8em;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--navy2)}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border:2px solid var(--line);background:var(--card);border-radius:14px;margin-bottom:10px;text-align:left;font-weight:700;color:var(--ink)}
.opt.sel{border-color:var(--navy2);background:#E8EEFB}
.opt.good{border-color:var(--green);background:#DDF3E5}
.opt.bad{border-color:#C0392B;background:#FBE3E0}
.opt[disabled]{opacity:.55}
.bar{height:12px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green)}
.notice{background:#FFF8E1;border:2px solid #E9C45A;border-radius:14px;padding:12px;font-size:.92em;margin:12px 0}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.sign{aspect-ratio:1;background:var(--navy);border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:.8em;text-align:center;padding:8px}
@media (prefers-reduced-motion:no-preference){ .fade{animation:f .25s ease-out} @keyframes f{from{opacity:0}to{opacity:1}} }
.btn,.opt,.chip,.card{min-height:48px}.chip{display:inline-flex;align-items:center}textarea{min-height:110px;resize:vertical;font-family:inherit}
.tile{min-height:110px}
</style>
</head>

}

  privacy(){ return `<div class="screen fade">${hdr("Privacy and my data","profile")}

async function setUser(session){
  S.user = session ? session.user : null;
  if(S.user){ try{ const {data}=await SB.from("profiles").select("role,display_name").eq("id",S.user.id).single(); if(data){ S.role=data.role; S.dispName=data.display_name; } }catch(e){} if(S.screen==="signin") S.screen="profile"; }
  else { S.role="deaf_catholic"; S.dbq=S.dbfb=S.dbacts=S.dbaudit=S.dbusers=S.dbtot=null; if(S.screen==="admin"||S.screen==="roles") S.screen="profile"; }
  render();
}
async function doAuth(){
  const email=S.email.trim(), pass=S.pass;
  if(!email||pass.length<8){ S.authMsg="Enter your email and a password of at least 8 characters."; return render(); }
  S.authMsg="Please wait..."; render();
  try{
    if(S.authMode==="up"){ const {data,error}=await SB.auth.signUp({email,password:pass,options:{data:{display_name:S.dname.trim()}}}); S.authMsg=error?error.message:(data.session?"":"Account created. Check your email to confirm it, then sign in."); }
    else { const {error}=await SB.auth.signInWithPassword({email,password:pass}); S.authMsg=error?error.message:""; }
  }catch(e){ S.authMsg="Could not reach the server. Check your internet and try again."; }
  S.pass=""; render();
}

async function loadTab(){
  if(!live()) return; const t=S.atab; S.dbErr="";
  try{
    if(t==="queue"){ const {data,error}=await SB.from("review_items").select("*").order("created_at",{ascending:false}); if(error) throw error; S.dbq=data.map(mapQ); }
    else if(t==="feedback"){ const {data,error}=await SB.from("feedback").select("*").order("created_at",{ascending:false}).limit(100); if(error) throw error; S.dbfb=data.map(f=>({type:f.type,who:f.who||"",lessonTitle:f.lesson_title||"General or new content",msg:f.message,date:new Date(f.created_at).toLocaleDateString()})); }
    else if(t==="reports"){ const a=await SB.from("activities").select("*").order("created_at",{ascending:false}).limit(100); if(a.error) throw a.error; S.dbacts=a.data.map(x=>({type:x.type,parish:x.parish,n:x.participants,date:new Date(x.created_at).toLocaleDateString()}));
      const tt=await SB.rpc("pilot_totals"); if(tt.error) throw tt.error; S.dbtot=tt.data; }
    else if(t==="audit"){ const {data,error}=await SB.from("audit_logs").select("*").order("created_at",{ascending:false}).limit(60); if(error) throw error; S.dbaudit=data.map(a=>({who:a.role||"system",m:a.message,t:new Date(a.created_at).toLocaleString([], {day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})})); }
    else if(t==="users"){ const {data,error}=await SB.from("profiles").select("*").order("created_at",{ascending:true}); if(error) throw error; S.dbusers=data; }
  }catch(e){ S.dbErr=(e&&e.message)||"Could not load data."; }
  render();
}
async function dbQueueAction(arg){
  const [id,k]=arg.split(":"); let patch=null;
  if(k==="usl") patch={usl_ok:true,flag:null}; else if(k==="doctrine") patch={doctrine_ok:true,flag:null}; else if(k==="tech") patch={tech_ok:true}; else if(k==="publish") patch={published:true};
  else if(k==="changes") patch={flag:"Changes requested by "+role().name,usl_ok:false,doctrine_ok:false,published:false};
  if(!patch) return; const {error}=await SB.from("review_items").update(patch).eq("id",id); S.dbErr=error?error.message:""; await loadTab();
}

async function changeRole(id,r){ const {error}=await SB.from("profiles").update({role:r}).eq("id",id); S.dbErr=error?error.message:""; await loadTab(); }

const cur = () => S.camps.find(x=>x.id===S.camp) || S.camps[0];
const pct = c => Math.min(100, Math.round(c.raised/c.target*100));
const shareUrl = c => SITE + "#" + c.id;
const waLink = c => "https://wa.me/?text=" + encodeURIComponent("\u{1F64F} " + c.title + "\n\n" + c.need + "\n\nGoal: " + fmt(c.target) + "\nSee it here: " + shareUrl(c) + "\n\n#CatholicUSL");
const getAmt = () => S.other ? (parseInt(String(S.other).replace(/\D/g,""),10)||0) : (S.amount||0);
function drawQR(){ const el=document.getElementById("qr"); if(!el) return; try{ if(window.QRCode){ el.innerHTML=""; new QRCode(el,{text:shareUrl(cur()),width:176,height:176,colorDark:"#02205A",colorLight:"#ffffff"}); } else { el.textContent=shareUrl(cur()); } }catch(e){ el.textContent=shareUrl(cur()); } }
function render(){ $app.innerHTML = (navigator.onLine===false?'<div class="notice" style="margin:0;border-radius:0;text-align:center" role="status">You are offline. Saved lesson text still works. Videos need internet.</div>':"") + screens[S.screen](); if(S.screen==="campaignDetail") drawQR(); }

document.addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t) return; const d=t.dataset;
  if(d.go){ if(d.go==="library"){S.q="";} return go(d.go); }
  if(d.lang){ S.lang=d.lang; return render(); }
  if(d.tile){ if(d.to==="library"){ S.cat={Prayers:"Prayers",Scripture:"Scripture",Mass:"Mass",Sacraments:"Sacraments",Catechesis:"Catechesis"}[d.tile]||"All"; S.q=""; } return go(d.to); }
  if(d.cat){ S.cat=d.cat; return render(); }
  if(d.item) return go("item",{item:d.item});
  if(d.fav){ S.fav=S.fav.includes(d.fav)?S.fav.filter(x=>x!==d.fav):[...S.fav,d.fav]; save(); return render(); }
  if(d.done){ S.progress=S.progress.includes(d.done)?S.progress.filter(x=>x!==d.done):[...S.progress,d.done]; save(); return render(); }
  if(d.pref){ if(d.pref==="text") S.textSize=S.textSize==="large"?"normal":"large"; else if(d.pref==="low") S.lowData=!S.lowData; else S.contrast=S.contrast==="high"?"normal":"high"; save(); applyPrefs(); return render(); }
  if(d.authmode){ S.authMode=d.authmode; S.authMsg=""; return render(); }
  if(d.authgo) return doAuth();
  if(d.signout){ SB.auth.signOut(); return; }
  if(d.role && !demo()) return;
  if(d.qa && live()) return dbQueueAction(d.qa);
  if(d.submit && live()) return dbSubmit();
  if(d.addact && live()) return dbAddAct();
  if(d.role){ S.role=d.role; S.atab=""; return render(); }
  if(d.tl){ S.tlang=d.tl; return render(); }
  if(d.atab){ S.atab=d.atab; S.msg=""; render(); return loadTab(); }
  if(d.qa){ const [id,k]=d.qa.split(":"); const q=S.queue.find(x=>x.id===id); if(!q) return;
    if(k==="changes"){ if(can("review_usl")||can("review_doctrine")){ q.flag="Changes requested by "+role().name; q.usl=false; q.doctrine=false; q.published=false; logA("Requested changes: "+q.title); } return render(); }
    const need={usl:"review_usl",doctrine:"review_doctrine",tech:"tech_check",publish:"publish"}[k];
    if(can(need)){ if(k==="publish"){ if(q.usl&&q.doctrine&&q.tech) q.published=true; } else { q[k]=true; q.flag=""; } logA({usl:"Confirmed signs accurate: ",doctrine:"Confirmed doctrine correct: ",tech:"Technical check passed: ",publish:"Published (demo): "}[k]+q.title); }
    return render(); }
  if(d.pack){ S.pack=S.pack.includes(d.pack)?S.pack.filter(x=>x!==d.pack):[...S.pack,d.pack]; return render(); }
  if(d.submit){ if(!can("submit")) return; if(!S.nTitle.trim()||!S.nEn.trim()){ S.msg="Add a title and the English words."; return render(); }
    S.queue.unshift({id:"q"+Date.now(),title:S.nTitle.trim(),type:S.nCat+(S.nLg.trim()?" (English + Luganda)":" (English)"),by:role().name,usl:false,doctrine:false,tech:false,published:false}); logA("Submitted for review: "+S.nTitle.trim());
    S.nTitle="";S.nEn="";S.nLg=""; S.msg="Sent for review (demo). It now appears in the review queue."; return render(); }
  if(d.invite){ logA("Invited a user (demo)"); S.msg=""; return render(); }
  if(d.quiz){ const id=d.quiz; const Q=id==="general"?C.quiz:C.items.find(x=>x.id===id).quiz; Object.assign(S,{qz:Q,qFor:id==="general"?null:id,quizI:0,quizScore:0,picked:null,quizDone:false}); if(S.qFor) S.item=S.qFor; return go("quiz"); }
  if(d.pick){ const Q=S.qz||C.quiz; S.picked=+d.pick; if(S.picked===Q[S.quizI].c) S.quizScore++; return render(); }
  if(d.next){ const Q=S.qz||C.quiz; S.picked=null; if(S.quizI+1<Q.length) S.quizI++; else { S.quizDone=true; if(S.qFor){ const prev=(S.scores[S.qFor]||{}).best||0; S.scores[S.qFor]={best:Math.max(prev,S.quizScore),total:Q.length}; if(S.quizScore/Q.length>=0.6 && !S.progress.includes(S.qFor)) S.progress.push(S.qFor); save(); } } return render(); }
  if(d.loadv){ S.loaded[d.loadv]=true; return render(); }
  if(d.fbt){ S.fbType=d.fbt; return render(); }
  if(d.fbfor){ S.fbLesson=d.fbfor; S.fbType="Correction"; S.fbSaved=null; return go("feedback"); }
  if(d.fbnew){ S.fbSaved=null; S.fbMsg=""; return render(); }
  if(d.fbsave){ if(!S.fbMsg.trim()){ S.err="Please write a short message."; return render(); } S.err="";
    const it=C.items.find(x=>x.id===S.fbLesson); const f={type:S.fbType,who:S.fbWho,lesson:S.fbLesson,lessonTitle:it?it.title:"General or new content",msg:S.fbMsg.trim(),date:new Date().toLocaleDateString()};
    S.fb.unshift(f); S.fbSaved=f; S.fbMsg=""; S.fbSync=""; save();
    if(SB){ SB.from("feedback").insert({type:f.type,who:f.who,lesson_id:f.lesson==="General"?null:f.lesson,lesson_title:f.lessonTitle,message:f.msg}).then(r=>{ S.fbSync=r.error?"fail":"ok"; render(); }); }
    return render(); }
  if(d.addact){ if(!can("reports")) return; const n=parseInt(String(S.nCount).replace(/\D/g,""),10)||0; if(!S.nParish.trim()){ S.msg="Add the parish or group."; return render(); }
    S.acts.unshift({type:S.nAct,parish:S.nParish.trim(),n,date:new Date().toLocaleDateString()}); logA("Logged activity: "+S.nAct+" at "+S.nParish.trim()); S.nParish="";S.nCount="";S.msg="Activity logged."; save(); return render(); }
  if(d.wipe){ try{ localStorage.removeItem("cusl"); }catch(e){} Object.assign(S,{fav:[],progress:[],scores:{},fb:[],acts:[],lowData:false,textSize:"normal",contrast:"normal"}); applyPrefs(); return go("profile"); }
  if(d.camp) return go("campaignDetail",{camp:d.camp,err:""});
  if(d.donate) return go("donate",{step:1,amount:null,other:"",phone:"",name:"",consent:false,err:"",comment:"",posted:false});
  if(d.amt){ S.amount=+d.amt; S.other=""; S.err=""; return render(); }
  if(d.consent){ S.consent=!S.consent; return render(); }
  if(d.step){ const n=+d.step;
    if(n===2 && getAmt()<1000){ S.err="Minimum donation is UGX 1,000."; return render(); }
    if(n===3 && String(S.phone).replace(/\D/g,"").length<9){ S.err="Enter a valid phone number."; return render(); }
    S.err=""; S.step=n; if(n===2) S.amount=getAmt(); window.scrollTo(0,0); return render(); }
  if(d.finish){ const c=cur(), a=getAmt(); c.raised+=a; c.count++; c.supporters.unshift({name:(S.consent&&S.name.trim())?S.name.trim():"Anonymous",amt:a,ago:"just now (demo)"}); S.lastAmt=a; S.step=4; S.posted=false; window.scrollTo(0,0); return render(); }
  if(d.postc){ const tx=S.comment.trim(); if(tx){ cur().comments.unshift({name:(S.consent&&S.name.trim())?S.name.trim():"Anonymous",text:tx}); S.posted=true; S.comment=""; } return render(); }
  if(d.copy){ try{ navigator.clipboard.writeText(S.screen==="admin"?SITE:shareUrl(cur())); t.textContent="Link copied"; }catch(e){ t.textContent=shareUrl(cur()); } return; }
});
document.addEventListener("input",e=>{
  if(e.target.dataset&&e.target.dataset.urole){ return changeRole(e.target.dataset.urole,e.target.value); }
  const f=e.target.dataset&&e.target.dataset.f; if(f){ S[f]=e.target.value; if(f==="other") S.amount=null; return; }
  if(e.target.id==="q"){ S.q=e.target.value; const p=e.target.selectionStart; render(); const n=document.getElementById("q"); n.focus(); n.setSelectionRange(p,p); }
  if(e.target.id==="dq"){ S.dq=e.target.value; const p=e.target.selectionStart; render(); const n=document.getElementById("dq"); n.focus(); n.setSelectionRange(p,p); }
});
window.addEventListener&&window.addEventListener("online",render);
window.addEventListener&&window.addEventListener("offline",render);
if(SB){ SB.auth.getSession().then(r=>setUser(r.data.session)); SB.auth.onAuthStateChange((ev,s)=>{ setTimeout(()=>setUser(s),0); }); }
try{ if("serviceWorker" in navigator && location.protocol.indexOf("http")===0 && location.hostname.indexOf("claude")<0) navigator.serviceWorker.register("sw.js"); }catch(e){}
render();
</script>
</body>
</html>
